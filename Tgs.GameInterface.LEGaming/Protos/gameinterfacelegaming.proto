syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.LEGaming.Protos";

package gameinterfacelegaming;

// The greeting service definition.
service GameInterfaceLEGaming {
  // Sends a greeting
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameRecord (GameRecordRequest) returns (GameRecordReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerBalanceRequest {
	string api_url = 1;
	string deskey = 2;
	string m_d5key = 3;
	string agent_id = 4;
	string player_code = 5;
}

message PlayerLogoutRequest {
	string api_url = 1;
	string deskey = 2;
	string m_d5key = 3;
	string agent_id = 4;
	string player_code = 5;
}

message FundRequest {
	string api_url = 1;
	string deskey = 2;
	string m_d5key = 3;
	string agent_id = 4;
	string player_code = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
	string api_url = 1;
	string deskey = 2;
	string m_d5key = 3;
	string agent_id = 4;
	string order_id = 5;
}

message GameUrlRequest {
	string api_url = 1;
	string deskey = 2;
	string m_d5key = 3;
	string agent_id = 4;
	string brand_code = 5;
	string player_code = 6;
	string ip_address = 7;
	string game_external_id = 8;
}

message GameRecordRequest {
	string api_url = 1;
	string deskey = 2;
	string m_d5key = 3;
	string agent_id = 4;
	google.protobuf.Timestamp start_time = 5;
	google.protobuf.Timestamp end_time = 6;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply {
	bool state = 1;
}

message PlayerBalanceReply {
	phoenix.protobuf.DecimalValue balance = 1;
	phoenix.protobuf.DecimalValue free_balance = 2;
	phoenix.protobuf.DecimalValue outstanding_balance = 3;
}

message FundReply {
	string order_id = 1;
}

message GameUrlReply{
	string game_url = 1;
}

message GameRecordReply {
	repeated GameRecordInfo items = 1;
}

message GameRecordInfo {
	string external_round_id = 1;
	string external_game_id = 2;
    string player_code = 3;
	google.protobuf.Timestamp external_created_on = 4;
	google.protobuf.Timestamp external_closed_on = 5;
	phoenix.protobuf.DecimalValue bet = 6;
	phoenix.protobuf.DecimalValue valid_bet = 7;
	phoenix.protobuf.DecimalValue settle = 8;
	phoenix.protobuf.DecimalValue commission = 9;
	phoenix.protobuf.DecimalValue turnover = 10;
	phoenix.protobuf.DecimalValue win_loss = 11;
	string additional_data = 12;
}

message CheckingServiceReply{
    string machine_name = 1;
}